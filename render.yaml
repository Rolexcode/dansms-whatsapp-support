services:
  - type: web
    name: dansms-whatsapp-support
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: WEBHOOK_VERIFY_TOKEN
        generateValue: true
      - key: META_APP_SECRET
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_GRAPH_API_VERSION
        value: v27.0
      - key: CLIENT_WHATSAPP_NUMBER
        sync: false
      - key: META_CLIENT_NOTIFICATION_TEMPLATE
        sync: false
      - key: META_CLIENT_NOTIFICATION_TEMPLATE_LANGUAGE
        value: en_US
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
